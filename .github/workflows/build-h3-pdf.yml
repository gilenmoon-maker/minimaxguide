name: Build full MiniMax H3 Guide PDF

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '01-База.md'
      - '02-Установка.md'
      - '03-Модели.md'
      - '04-Workflow.md'
      - '05-Эксперименты.md'
      - '06-Тестирование.md'
      - '07-Сверка_чатов.md'
      - '.github/workflows/build-h3-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools and Cyrillic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu

      - name: Assemble guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              'README.md',
              '01-База.md',
              '02-Установка.md',
              '03-Модели.md',
              '04-Workflow.md',
              '05-Эксперименты.md',
              '06-Тестирование.md',
              '07-Сверка_чатов.md',
          ]
          out = Path('MiniMax_H3_ComfyUI_Full_Guide.md')
          parts = []
          for f in files:
              p = Path(f)
              if not p.exists():
                  raise SystemExit(f'Missing guide file: {f}')
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'(?:cite|filecite)[^]*', '', text)
              parts.append(text.strip())
          out.write_text('\n\n\\newpage\n\n'.join(parts) + '\n', encoding='utf-8')
          print(f'Assembled {out}')
          PY

      - name: Build PDF
        run: |
          pandoc MiniMax_H3_ComfyUI_Full_Guide.md \
            -o docs/MiniMax_H3_ComfyUI_Full_Guide.pdf \
            --pdf-engine=xelatex \
            --from=markdown \
            --toc \
            --number-sections \
            -V papersize=a4 \
            -V geometry:margin=18mm \
            -V mainfont='DejaVu Sans' \
            -V sansfont='DejaVu Sans' \
            -V monofont='DejaVu Sans Mono' \
            -V colorlinks=true \
            -V linkcolor=blue

      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MiniMax_H3_ComfyUI_Full_Guide.pdf
          git diff --cached --quiet || git commit -m 'Build full MiniMax H3 ComfyUI PDF'
          git push

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMax-H3-ComfyUI-Full-Guide
          path: docs/MiniMax_H3_ComfyUI_Full_Guide.pdf
          if-no-files-found: error
          retention-days: 30
